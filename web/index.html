<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="icon" href="data:,">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS5</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  video { width: 100vw; height: 100vh; object-fit: contain; background: #000; display: block; }
  #msg {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #8a8a8a; font: 500 18px/1.4 system-ui, sans-serif; pointer-events: none; text-align: center;
  }
  #sound {
    position: fixed; right: 16px; bottom: 16px; padding: 8px 14px; border: 0; border-radius: 8px;
    background: rgba(255,255,255,.14); color: #fff; font: 500 14px system-ui, sans-serif; cursor: pointer;
  }
  #sound[hidden], #msg[hidden], #stats[hidden] { display: none; }
  #stats { position: fixed; left: 12px; top: 10px; color: #6f6f6f; font: 12px ui-monospace, monospace; }
</style>
</head>
<body>
<video id="v" muted playsinline></video>
<div id="msg">En attente du flux PS5…<br>Lance une diffusion Twitch depuis la console.<br><small>f plein écran · m muet · s stats</small></div>
<button id="sound" hidden>🔇 Activer le son</button>
<div id="stats" hidden></div>
<script src="mpegts.js"></script>
<script>
const video = document.getElementById('v');
const msg = document.getElementById('msg');
const soundBtn = document.getElementById('sound');
const stats = document.getElementById('stats');
let player = null;

function stop() {
  if (!player) return;
  try { player.pause(); player.unload(); player.detachMediaElement(); player.destroy(); } catch (e) {}
  player = null;
}

function start() {
  stop();
  player = mpegts.createPlayer(
    { type: 'flv', isLive: true, hasAudio: true, hasVideo: true, url: new URL('/live.flv', location.href).href },
    {
      enableWorker: true,
      enableStashBuffer: false,          // pas de tampon côté loader
      lazyLoad: false,
      liveSync: true,                     // accélère légèrement pour rattraper le direct
      liveSyncTargetLatency: 0.4,
      liveSyncMaxLatency: 1.0,
      liveSyncPlaybackRate: 1.1,
      autoCleanupSourceBuffer: true,
    }
  );
  player.attachMediaElement(video);
  player.on(mpegts.Events.ERROR, () => { stop(); setTimeout(poll, 1500); });
  player.on(mpegts.Events.LOADING_COMPLETE, () => { stop(); setTimeout(poll, 1000); });
  player.load();
  video.play().catch(() => {});
  msg.hidden = true;
  soundBtn.hidden = !video.muted;
}

async function poll() {
  if (player) return;
  try {
    const r = await fetch('/status', { cache: 'no-store' });
    if ((await r.json()).live) { start(); return; }
  } catch (e) {}
  msg.hidden = false;
  setTimeout(poll, 1500);
}

// Les navigateurs bloquent l'autoplay avec son : on démarre muet, un clic active le son.
function unmute() { video.muted = false; video.play().catch(() => {}); soundBtn.hidden = true; }
soundBtn.onclick = unmute;
video.onclick = unmute;
document.addEventListener('keydown', e => {
  if (e.key === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  if (e.key === 's') stats.hidden = !stats.hidden;
  if (e.key === 'm') { video.muted = !video.muted; soundBtn.hidden = !video.muted; }
});

// Latence affichée (tampon restant) — utile pour régler.
setInterval(() => {
  if (!player || !video.buffered.length) { stats.textContent = ''; return; }
  const lag = video.buffered.end(video.buffered.length - 1) - video.currentTime;
  stats.textContent = `tampon ${(lag * 1000).toFixed(0)} ms · ${video.videoWidth}×${video.videoHeight}`;
}, 500);

poll();
</script>
</body>
</html>
